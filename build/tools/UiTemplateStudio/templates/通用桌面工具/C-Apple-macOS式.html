<style>:root{
  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:"Cascadia Mono","JetBrains Mono",Consolas,"SF Mono",monospace;
  --fs-cap:11px;--fs-ui:12px;--fs-body:13px;--fs-t3:15px;--fs-t2:17px;--fs-t1:22px;
  --r-xs:2px;--r-sm:4px;--r-md:6px;--r-lg:8px;--r-ctl:4px;
  --h-row:22px;--h-ctl:24px;--h-ctl-lg:28px;--h-menu:24px;--h-tab:30px;--h-tool:32px;--h-title:30px;--h-status:22px;

  --bg-hover:rgba(0,0,0,.05);--bg-active:rgba(0,0,0,.09);
  --border:#E5E5E5;--border-strong:#D0D0D5;--sash:#E5E5E5;--sash-hover:#C8C8C8;
  --text:#1D1D1F;--text-2:#6E6E73;--text-3:#8A8A8F;--text-on-accent:#fff;
  --accent:#0071E3;--accent-hover:#0077ED;--accent-press:#0062C4;--accent-soft:rgba(0,113,227,.12);
  --danger:#D92D20;--warning:#B76E00;--success:#248A3D;--sel:#FFB340;
  --c-m:#4a7fb5;--c-v:#c48a4a;--c-n:#8b7aad;--c-d:#5a9a72;
  --sb-thumb:rgba(100,100,100,.35);--sb-thumb-hover:rgba(100,100,100,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);
  --shadow-2:0 4px 12px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);
  --shadow-3:0 12px 32px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.08);
  --scrim:rgba(0,0,0,.32);
  --cad-bg:#F7F7F5;--cad-grid:rgba(0,0,0,.06);--cad-line:#1d1d1f;--cad-axis:#C0392B;--cad-dim:#1F7A4D;--cad-text:#333;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg-window:#1B1B1B;--bg-panel:#222222;--bg-raised:#2C2C2C;--bg-input:#161616;--bg-canvas:#212830;--bg-header:#1B1B1B;--bg-ctl:#2E2E2E;
  --bg-hover:rgba(255,255,255,.06);--bg-active:rgba(255,255,255,.11);
  --border:#2E2E2E;--border-strong:#3F3F3F;--sash:#2E2E2E;--sash-hover:#4A4A4A;
  --text:#E6E6E6;--text-2:#A6A6A6;--text-3:#7C7C7C;
  --accent:#0A84FF;--accent-hover:#409CFF;--accent-press:#0070E0;--accent-soft:rgba(10,132,255,.22);
  --danger:#FF453A;--warning:#FFB340;--success:#30D158;
  --sb-thumb:rgba(160,160,160,.30);--sb-thumb-hover:rgba(160,160,160,.50);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.04);
  --shadow-2:0 4px 14px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.07);
  --shadow-3:0 14px 36px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.09);
  --scrim:rgba(0,0,0,.5);
  --cad-bg:#212830;--cad-grid:rgba(255,255,255,.05);--cad-line:#E8E8E8;--cad-axis:#E06C5A;--cad-dim:#5BC48A;--cad-text:#d8d8d8;
  color-scheme:dark;
}
html[data-density="comfortable"]{--fs-ui:13px;--h-row:28px;--h-ctl:28px;--h-ctl-lg:32px;--h-menu:28px;--h-tab:35px;--h-tool:40px;--pad:12px;--r-ctl:6px}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) transparent}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font-ui);font-size:var(--fs-ui);color:var(--text);background:var(--bg-window);line-height:1.45;user-select:none;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font:inherit;color:inherit}
svg.ic{width:var(--ic);height:var(--ic);flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.ic.s12{width:12px;height:12px}svg.ic.s14{width:14px;height:14px}svg.ic.s20{width:20px;height:20px}svg.ic.s24{width:24px;height:24px}svg.ic.s32{width:32px;height:32px;stroke-width:1.5}
kbd,.kbd{font-family:var(--font-mono);font-size:11px;color:var(--text-3)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg-window)}
.hidden{display:none!important}
.sp{flex:1}
/* ---------- title bar ---------- */
.titlebar{height:var(--h-title);flex:none;display:flex;align-items:center;background:var(--bg-header);border-bottom:1px solid var(--border);position:relative;z-index:20}
.titlebar .appicon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.titlebar .ttl{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.menubar{display:flex;align-items:center;height:100%}
.mb-item{height:calc(100% - 6px);padding:0 9px;display:flex;align-items:center;border-radius:var(--r-sm);cursor:default;white-space:nowrap}
.mb-item:hover,.mb-item.open{background:var(--bg-active)}
.cmdcenter{height:22px;width:300px;max-width:32vw;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--bg-input);color:var(--text-3);cursor:pointer;font-size:12px}
.cmdcenter:hover{border-color:var(--text-3)}
.cmdcenter kbd{margin-left:auto}
.tb-btn{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;padding:0}
.tb-btn:hover{background:var(--bg-hover);color:var(--text)}
.tb-btn.on{color:var(--accent)}
.tb-txt{height:22px;padding:0 8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg-ctl);cursor:pointer;font-size:11.5px;display:inline-flex;align-items:center;gap:4px;margin:0 2px;white-space:nowrap}
.tb-txt:hover{background:var(--bg-hover)}
.winctl{display:flex;height:100%}
.winctl button{width:46px;height:100%;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:default;padding:0}
.winctl button:hover{background:var(--bg-hover)}.winctl button.x:hover{background:#C42B1C;color:#fff}
.winctl svg{width:10px;height:10px;stroke:currentColor;stroke-width:1;fill:none}
/* ---------- toolbar ---------- */
.toolbar{height:var(--h-tool);flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--bg-header);border-bottom:1px solid var(--border);overflow:hidden}
.tbtn{height:var(--h-ctl);min-width:var(--h-ctl);padding:0 4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;background:none;border-radius:var(--r-ctl);color:var(--text);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--bg-hover)}.tbtn:active{background:var(--bg-active)}
.tbtn.on{background:var(--accent-soft);color:var(--accent)}
.tbtn.lbl{padding:0 8px}
.tbtn:disabled{opacity:.4}
.tsep{width:1px;height:16px;background:var(--border-strong);margin:0 6px;flex:none}
.tsel{height:var(--h-ctl);border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:var(--bg-input);padding:0 6px;font-size:var(--fs-ui)}
.tlabel{color:var(--text-3);font-size:11px;margin:0 4px 0 2px}
/* ---------- ribbon ---------- */
.ribbon{flex:none;background:var(--bg-header);border-bottom:1px solid var(--border)}
.rb-tabs{display:flex;align-items:flex-end;height:26px;padding:0 6px;gap:2px}
.rb-tab{height:24px;padding:0 12px;display:flex;align-items:center;border-radius:var(--r-sm) var(--r-sm) 0 0;cursor:default;color:var(--text-2)}
.rb-tab:hover{color:var(--text);background:var(--bg-hover)}
.rb-tab.on{background:var(--bg-panel);color:var(--accent);font-weight:600;box-shadow:0 -1px 0 var(--border) inset}
.rb-tab.ctx{color:#b5651d}
.rb-tab.file{background:var(--accent);color:#fff;border-radius:var(--r-sm);height:22px;margin-bottom:1px}
.rb-body{height:94px;background:var(--bg-panel);border-top:1px solid var(--border);display:flex;overflow:hidden}
.ribbon.min .rb-body{display:none}
.rb-panel{display:none;height:100%;padding:3px 4px 0}.rb-panel.on{display:flex}
.rb-group{display:flex;flex-direction:column;border-right:1px solid var(--border);padding:0 4px;height:100%}
.rb-items{flex:1;display:flex;gap:2px;align-items:flex-start}
.rb-col{display:flex;flex-direction:column;gap:1px}
.rb-name{height:18px;font-size:11px;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.rb-name .launch{cursor:pointer;border-radius:2px;display:inline-flex}.rb-name .launch:hover{background:var(--bg-active);color:var(--text)}
.rb-big{width:54px;height:68px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;font-size:11px;line-height:1.2;text-align:center;color:var(--text)}
.rb-big:hover{background:var(--bg-hover)}.rb-big svg.ic{width:24px;height:24px;stroke-width:1.5}
.rb-big.on{background:var(--accent-soft);color:var(--accent)}
.rb-small{height:21px;display:flex;align-items:center;gap:5px;padding:0 6px 0 4px;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap;font-size:11.5px;color:var(--text)}
.rb-small:hover{background:var(--bg-hover)}
/* ---------- workspace / docks ---------- */
.workspace{flex:1;min-height:0;display:flex;position:relative}
.vstack{display:flex;flex-direction:column;min-width:0;min-height:0}
.hstack{display:flex;flex-direction:row;min-width:0;min-height:0}
.grow{flex:1;min-width:0;min-height:0}
.sash{flex:none;position:relative;z-index:5;background:transparent}
.sash.v{width:4px;margin:0 -2px;cursor:col-resize}.sash.h{height:4px;margin:-2px 0;cursor:row-resize}
.sash::after{content:"";position:absolute;background:var(--sash);transition:background .1s .3s}
.sash.v::after{left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%)}
.sash.h::after{top:50%;left:0;right:0;height:1px;transform:translateY(-50%)}
.sash:hover::after{background:var(--sash-hover)}
.sash.drag::after{background:var(--accent);transition:none}
.sash.v:hover::after,.sash.v.drag::after{width:2px}.sash.h:hover::after,.sash.h.drag::after{height:2px}
.dock{display:flex;flex-direction:column;background:var(--bg-panel);min-width:0;min-height:0;overflow:hidden;position:relative}
.dock.collapsed{display:none}
.dock-tabs{height:28px;flex:none;display:flex;align-items:stretch;background:var(--bg-header);border-bottom:1px solid var(--border);padding:0 2px;overflow:hidden}
.dtab{display:flex;align-items:center;gap:5px;padding:0 10px;color:var(--text-2);cursor:default;font-size:11.5px;white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.dtab:hover{color:var(--text)}
.dtab.on{color:var(--text);border-bottom-color:var(--accent)}
.dock-tools{margin-left:auto;display:flex;align-items:center;padding-right:2px}
.dock-tools .tb-btn{width:22px;height:22px}
.dock-body{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow:auto;display:none}.pane.on{display:block}
.pane.flex.on{display:flex;flex-direction:column}
.dock.dropzone::after{content:"停靠到此";position:absolute;inset:4px;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:600;z-index:30;pointer-events:none}
.dock.dropzone.hot::after{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;padding:3px 10px;background:var(--bg-raised);border:1px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--shadow-2);font-size:12px}
.sec-head{height:24px;display:flex;align-items:center;gap:4px;padding:0 6px 0 8px;font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.02em;flex:none;cursor:default}
.sec-head .tb-btn{width:20px;height:20px}
.float-win{position:fixed;z-index:400;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-3);display:flex;flex-direction:column;min-width:220px;min-height:140px;overflow:hidden;resize:both}
.float-win .fw-head{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;background:var(--bg-header);border-bottom:1px solid var(--border);cursor:move;font-size:12px}
.float-win .fw-body{flex:1;position:relative;min-height:0}
.float-win .fw-body>.pane{display:block}
/* activity bar (vertical icon tabs) */
.activity{width:42px;flex:none;display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:2px;background:var(--bg-header);border-right:1px solid var(--border)}
.act{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-3);border-radius:var(--r-sm);cursor:pointer;position:relative;border:0;background:none}
.act svg.ic{width:20px;height:20px;stroke-width:1.5}
.act:hover{color:var(--text)}
.act.on{color:var(--text)}.act.on::before{content:"";position:absolute;left:-3px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:1px}
.act .badge{position:absolute;right:3px;bottom:4px;min-width:14px;height:14px;border-radius:7px;background:var(--accent);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
/* editor tabs */
.etabs{height:var(--h-tab);flex:none;display:flex;background:var(--bg-window);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
.etabs::-webkit-scrollbar{height:3px}
.etab{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;min-width:90px;max-width:220px;border-right:1px solid var(--border);color:var(--text-2);cursor:default;white-space:nowrap;position:relative;font-size:12px}
.etab .nm{overflow:hidden;text-overflow:ellipsis}
.etab.on{background:var(--bg-panel);color:var(--text)}.etab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.etab.preview .nm{font-style:italic}
.etab .x{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;margin-left:auto;opacity:0}
.etab:hover .x,.etab.on .x{opacity:1}.etab .x:hover{background:var(--bg-active)}
.etab.dirty .x::before{content:"●";font-size:10px;color:var(--text-2)}.etab.dirty .x svg{display:none}.etab.dirty .x:hover svg{display:block}.etab.dirty .x:hover::before{display:none}
.ebody{flex:1;min-height:0;position:relative;background:var(--bg-panel)}
.epage{position:absolute;inset:0;display:none;overflow:auto}.epage.on{display:block}.epage.flex.on{display:flex}
/* ---------- status bar ---------- */
.statusbar{height:var(--h-status);flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--bg-header);border-top:1px solid var(--border);font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.sb-item{height:18px;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:var(--r-sm);cursor:default}
.sb-item:hover{background:var(--bg-hover);color:var(--text)}
.sb-item.on{color:var(--accent)}
.sb-item.tog{font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.sb-item.busy{background:var(--accent);color:#fff}
.sb-msg{color:var(--text);transition:opacity .4s}
.progress{width:80px;height:4px;background:var(--bg-active);border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* ---------- menus ---------- */
.menu{position:fixed;z-index:1000;min-width:200px;max-width:380px;padding:4px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-2);font-size:var(--fs-ui);color:var(--text)}
.mi{height:var(--h-menu);display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-sm);cursor:default;white-space:nowrap;position:relative}
.mi .mic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.mi .ml{flex:1}
.mi .mk{font-family:var(--font-mono);font-size:11px;color:var(--text-3);margin-left:24px}
.mi .ma{color:var(--text-3);font-size:11px;margin-left:8px}
.mi:hover,.mi.hl{background:var(--bg-active)}
.mi.dis{opacity:.42;pointer-events:none}
.mi.danger,.mi.danger .mic{color:var(--danger)}
.msep{height:1px;background:var(--border);margin:4px 6px}
.mhead{padding:4px 8px 2px;font-size:11px;font-weight:600;color:var(--text-3)}
.mi .chk{width:16px;text-align:center;color:var(--accent);flex:none}
/* ---------- buttons/inputs ---------- */
.btn{height:var(--h-ctl);min-width:64px;padding:0 12px;border:1px solid var(--border-strong);background:var(--bg-ctl);border-radius:var(--r-ctl);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--bg-hover)}.btn:active{background:var(--bg-active)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--text-on-accent);height:var(--h-ctl-lg)}
.btn.pri:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:22px;min-width:0;padding:0 8px;font-size:11.5px}
.inp,select.inp{height:var(--h-ctl);border:1px solid var(--border-strong);background:var(--bg-input);border-radius:var(--r-ctl);padding:0 8px;min-width:0;outline:none;color:var(--text)}
.inp:hover{border-color:var(--text-3)}.inp:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
textarea.inp{height:auto;padding:6px 8px;resize:vertical}
.chkbox{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chkbox input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.switch{position:relative;width:32px;height:18px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:9px;background:var(--bg-active);border:1px solid var(--border-strong);transition:.12s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:var(--text-2);transition:.12s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}.switch input:checked+span::after{left:16px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-ctl);overflow:hidden;height:var(--h-ctl)}
.seg button{border:0;background:var(--bg-ctl);padding:0 10px;cursor:pointer;border-right:1px solid var(--border-strong);color:var(--text)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent-soft);color:var(--accent)}
.num{display:inline-flex;align-items:center;height:var(--h-ctl);border:1px solid var(--border-strong);background:var(--bg-input);border-radius:var(--r-ctl);overflow:hidden;min-width:0;cursor:ew-resize;position:relative}
.num input{border:0;background:transparent;width:100%;text-align:center;font-family:var(--font-mono);font-size:11.5px;outline:none;cursor:ew-resize;padding:0 2px;min-width:0}
.num input:focus{cursor:text}
.num .ar{width:14px;display:flex;align-items:center;justify-content:center;color:var(--text-3);opacity:0;cursor:pointer;flex:none;font-size:10px}
.num:hover .ar{opacity:1}.num:focus-within{border-color:var(--accent)}
.num .unit{font-size:10.5px;color:var(--text-3);padding-right:4px;flex:none}
/* ---------- property grid ---------- */
.pg{font-size:var(--fs-ui)}
.pg-head{height:var(--h-ctl);display:flex;align-items:center;gap:4px;padding:0 6px;font-weight:600;cursor:pointer;background:var(--bg-window);border-bottom:1px solid var(--border);color:var(--text)}
.pg-head .chev{transition:transform .12s;display:inline-flex}.pg-group.closed .chev{transform:rotate(-90deg)}
.pg-group.closed .pg-rows{display:none}
.pg-row{display:grid;grid-template-columns:40% 1fr 18px;align-items:center;min-height:calc(var(--h-ctl) + 4px);padding:0 4px 0 12px;position:relative;gap:4px}
.pg-row:hover{background:var(--bg-hover)}
.pg-row.mod::before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:2px;background:var(--accent);border-radius:1px}
.pg-l{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-v{min-width:0;display:flex;gap:4px;align-items:center}
.pg-v>*{flex:1;min-width:0}
.pg-v .inp{height:calc(var(--h-ctl) - 2px);width:100%}
.pg-rst{opacity:0;cursor:pointer;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.pg-row.mod .pg-rst{opacity:1}.pg-rst:hover{color:var(--accent)}
.pg-color{display:flex;align-items:center;gap:6px}.pg-color i{width:14px;height:14px;border-radius:3px;border:1px solid var(--border-strong);flex:none}
/* ---------- tree / list / table ---------- */
.tree{padding:2px 0}
.tn{height:var(--h-row);display:flex;align-items:center;gap:4px;padding-right:6px;cursor:default;white-space:nowrap;position:relative}
.tn:hover{background:var(--bg-hover)}
.tn.sel{background:var(--accent-soft)}.tn.sel.focus{outline:1px solid var(--accent);outline-offset:-1px}
.tn .tw{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text-3);flex:none;transition:transform .12s}
.tn.open .tw{transform:rotate(90deg)}
.tn .tl{flex:1;overflow:hidden;text-overflow:ellipsis}
.tn .tm{color:var(--text-3);font-size:11px}
.tn .tact{display:flex;gap:1px;opacity:.0}.tn:hover .tact,.tn .tact.keep{opacity:1}
.tn .tact span{display:flex;color:var(--text-3);padding:1px;border-radius:3px;cursor:pointer}.tn .tact span:hover{color:var(--text);background:var(--bg-active)}
.tbl{border-collapse:collapse;width:100%;font-size:11.5px}
.tbl th{position:sticky;top:0;background:var(--bg-window);font-weight:600;color:var(--text-2);text-align:left;font-size:11px;height:var(--h-row);padding:0 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{height:var(--h-row);padding:0 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
.tbl td.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--bg-hover)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td[contenteditable]{cursor:text;outline:none}.tbl td[contenteditable]:focus{box-shadow:inset 0 0 0 1px var(--accent);background:var(--bg-input)}
.tbl select{border:0;background:transparent;font-size:11.5px;width:100%;outline:none}
/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:800;display:flex;align-items:center;justify-content:center;animation:fadein .12s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dlg{background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-3);display:flex;flex-direction:column;max-height:88vh;max-width:96vw;position:relative;font-size:var(--fs-body)}
.dlg-h{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 20px;cursor:move}
.dlg-h .t{font-size:var(--fs-t3);font-weight:600;flex:1}
.dlg-b{padding:4px 20px 16px;overflow:auto;flex:1;min-height:0;color:var(--text)}
.dlg-b p{margin:4px 0 10px;color:var(--text-2)}
.dlg-f{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);align-items:center;background:var(--bg-window);border-radius:0 0 var(--r-lg) var(--r-lg)}
.dlg-f .left{margin-right:auto;color:var(--text-3);font-size:12px}
.form{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}
.form label{color:var(--text-2)}
.form .full{grid-column:1/-1}
/* settings */
.set{display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;height:min(620px,80vh);width:min(900px,94vw)}
.set-top{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:0 20px 10px;border-bottom:1px solid var(--border)}
.set-top .inp{flex:1}
.set-nav{overflow:auto;padding:8px;border-right:1px solid var(--border);background:var(--bg-window)}
.set-nav .cat{height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--text-2)}
.set-nav .cat.sub{padding-left:28px;height:24px;font-size:11.5px}
.set-nav .cat:hover{background:var(--bg-hover);color:var(--text)}.set-nav .cat.on{background:var(--accent-soft);color:var(--accent)}
.set-nav .cat .cnt{margin-left:auto;font-size:10px;background:var(--accent);color:#fff;border-radius:7px;padding:0 5px}
.set-list{overflow:auto;padding:4px 20px 20px}
.set-list h3{font-size:var(--fs-t2);margin:16px 0 6px;font-weight:600}
.set-it{display:flex;gap:16px;align-items:center;padding:10px 12px;border-radius:var(--r-md);position:relative}
.set-it:hover{background:var(--bg-hover)}
.set-it.mod::before{content:"";position:absolute;left:2px;top:10px;bottom:10px;width:2px;background:var(--accent)}
.set-it .d{flex:1;min-width:0}
.set-it .d b{font-weight:600;display:block}.set-it .d code{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-left:6px;font-weight:400}
.set-it .d span{color:var(--text-2);font-size:12px}
.set-it .c{flex:none;display:flex;align-items:center;gap:6px}
.set-it .rst{opacity:0;cursor:pointer;color:var(--text-3)}.set-it.mod .rst{opacity:1}
.set-it mark{background:color-mix(in srgb,var(--warning) 35%,transparent);color:inherit;border-radius:2px}
.restart-bar{display:none;align-items:center;gap:8px;padding:6px 20px;background:color-mix(in srgb,var(--warning) 14%,transparent);font-size:12px}
.restart-bar.on{display:flex}
/* palette */
.palette{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:min(620px,92vw);z-index:900;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-3);overflow:hidden}
.palette input{width:100%;height:36px;border:0;border-bottom:1px solid var(--border);background:transparent;padding:0 14px;outline:none;font-size:13px}
.pal-list{max-height:380px;overflow:auto;padding:4px}
.pal-it{height:28px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer}
.pal-it.hl{background:var(--accent-soft)}.pal-it .cat{color:var(--text-3);font-size:11px}.pal-it .k{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-3)}
.pal-it b{color:var(--accent);font-weight:600}
.pal-hint{padding:6px 14px;font-size:11px;color:var(--text-3);border-top:1px solid var(--border)}
/* toasts */
.toasts{position:fixed;right:16px;bottom:34px;z-index:950;display:flex;flex-direction:column;gap:8px;width:360px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;padding:10px 12px;background:var(--bg-raised);border:1px solid var(--border-strong);border-left:3px solid var(--accent);border-radius:var(--r-lg);box-shadow:var(--shadow-2);animation:tin .18s ease-out;font-size:12.5px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.toast.ok{border-left-color:var(--success)}.toast.warn{border-left-color:var(--warning)}.toast.err{border-left-color:var(--danger)}
.toast .ti{color:var(--accent);flex:none;padding-top:1px}.toast.ok .ti{color:var(--success)}.toast.warn .ti{color:var(--warning)}.toast.err .ti{color:var(--danger)}
.toast .tb{flex:1;min-width:0}.toast .tt{font-weight:600}.toast .tm{color:var(--text-2)}
.toast .tacts{display:flex;gap:6px;margin-top:6px}
.toast .tx{cursor:pointer;color:var(--text-3);flex:none}
/* notification center */
.ncenter{position:fixed;right:12px;bottom:30px;width:380px;max-height:60vh;z-index:940;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-3);display:flex;flex-direction:column}
.ncenter .nh{height:34px;display:flex;align-items:center;padding:0 8px 0 12px;font-weight:600;border-bottom:1px solid var(--border)}
.ncenter .nl{overflow:auto;padding:4px}
.ncenter .ni{padding:6px 8px;border-radius:var(--r-sm);display:flex;gap:8px;font-size:12px}.ncenter .ni:hover{background:var(--bg-hover)}
.ncenter .ni small{color:var(--text-3);display:block}
/* tooltip */
.tip{position:fixed;z-index:2000;max-width:320px;padding:4px 8px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--r-sm);box-shadow:var(--shadow-2);font-size:12px;pointer-events:none;color:var(--text)}
.tip .k{font-family:var(--font-mono);color:var(--text-3);margin-left:8px;font-size:11px}
.tip .dsc{color:var(--text-2);font-size:11.5px;margin-top:2px}
/* pie */
.pie{position:fixed;z-index:1500;width:0;height:0;pointer-events:none}
.pie .pc{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid var(--border-strong);background:color-mix(in srgb,var(--bg-raised) 70%,transparent)}
.pie .pdir{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent);transition:transform .05s}
.pie .pt{position:absolute;transform:translate(-50%,-50%);height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:13px;box-shadow:var(--shadow-2);white-space:nowrap;pointer-events:auto;cursor:pointer;font-size:12px}
.pie .pt.hl{background:var(--accent);color:#fff;border-color:var(--accent)}
.pie .pt.dis{opacity:.45}
.pie .pt .n{font-family:var(--font-mono);font-size:10px;color:var(--text-3)}.pie .pt.hl .n{color:#fff}
.pie .ptitle{position:absolute;left:0;top:-128px;transform:translateX(-50%);font-size:11px;color:var(--text-2);background:var(--bg-raised);padding:1px 8px;border-radius:8px;border:1px solid var(--border)}
/* command line */
.cmdline{display:flex;flex-direction:column;font-family:var(--font-mono);font-size:12px;background:var(--bg-panel);min-height:0}
.cl-hist{flex:1;overflow:auto;padding:2px 8px;color:var(--text-2);white-space:pre-wrap;min-height:0;line-height:1.5;user-select:text}
.cl-hist .u{color:var(--text)}.cl-hist .e{color:var(--danger)}.cl-hist .o{color:var(--success)}
.cl-in{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-top:1px solid var(--border);background:var(--bg-input)}
.cl-in .pr{color:var(--text-2);white-space:nowrap}
.cl-in .pr .kw{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
.cl-in input{flex:1;border:0;background:transparent;outline:none;font-family:var(--font-mono);font-size:12px;min-width:40px}
.cl-sugg{position:fixed;z-index:1100;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:3px;font-family:var(--font-mono);font-size:12px;min-width:260px}
.cl-sugg div{padding:2px 8px;border-radius:3px;display:flex;gap:10px;cursor:pointer}.cl-sugg div.hl{background:var(--accent-soft)}.cl-sugg small{color:var(--text-3);font-family:var(--font-ui)}
/* info drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;z-index:1200;background:var(--bg-panel);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-3);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;font-size:12.5px;user-select:text}
.drawer.on{transform:none}
.drawer .dh{height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;flex:none}
.drawer .db{overflow:auto;padding:10px 16px 30px;line-height:1.6}
.drawer h4{margin:14px 0 6px;font-size:13px}
.drawer ul{padding-left:18px;margin:4px 0}.drawer li{margin:3px 0}
.drawer .rule{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:5px 0;border-bottom:1px solid var(--border)}
.drawer .rule a{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-decoration:none;white-space:nowrap}
.drawer .pros li::marker{content:"＋ ";color:var(--success)}.drawer .cons li::marker{content:"－ ";color:var(--danger)}
.drawer .fit{background:var(--accent-soft);border-radius:var(--r-md);padding:8px 10px;margin:8px 0}
.drawer .tested{font-size:11.5px;color:var(--text-2)}
.drawer .tested span{display:inline-block;margin:2px 4px 2px 0;padding:0 6px;border-radius:9px;background:var(--bg-active)}
/* start page */
.start{max-width:880px;margin:0 auto;padding:48px 40px;display:grid;grid-template-columns:1fr 1fr;gap:32px;user-select:none}
.start h1{grid-column:1/-1;font-size:var(--fs-t1);font-weight:600;margin:0}
.start h1 small{display:block;font-size:13px;color:var(--text-2);font-weight:400;margin-top:4px}
.start h3{font-size:13px;margin:0 0 8px;color:var(--text-2);font-weight:600}
.start .lnk{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:var(--r-sm);color:var(--accent);cursor:pointer}
.start .lnk:hover{background:var(--bg-hover)}
.start .lnk small{color:var(--text-3);margin-left:auto;font-size:11px}
.start .keys div{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-2);border-bottom:1px dashed var(--border)}
/* misc */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);height:100%;padding:20px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;background:var(--bg-active);font-size:11px;color:var(--text-2)}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}.kv span:nth-child(odd){color:var(--text-3)}
.canvas-modal{outline:2px solid var(--accent);outline-offset:-2px}
.legend{display:flex;gap:10px;font-size:11px;color:var(--text-2);align-items:center}.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.searchbox{display:flex;align-items:center;gap:6px;height:var(--h-ctl);margin:6px 8px;padding:0 8px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);background:var(--bg-input);color:var(--text-3)}
.searchbox input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--text)}
.focus-ring:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pick-btn{position:fixed;}

/* ===== HyMd：编辑器 / 预览 / 文献 / 作图 / 图片 ===== */
.md-ed{position:relative;display:flex;height:100%;min-height:0;background:var(--bg-input,var(--bg-panel));--ed-fs:13.5px;--ed-lh:22px}
.md-gut{width:44px;flex:none;overflow:hidden;text-align:right;padding:12px 8px 0 0;color:var(--text-3);font:var(--ed-fs)/var(--ed-lh) var(--font-mono);user-select:none;border-right:1px solid var(--border)}
.md-gut div{line-height:var(--ed-lh)}.md-gut .cur{color:var(--text)}
.md-scroll{position:relative;flex:1;overflow:auto;min-width:0}
.md-hl,.md-ta,.md-mir{margin:0;padding:12px 18px 40px;font:var(--ed-fs)/var(--ed-lh) var(--font-mono);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;tab-size:2;box-sizing:border-box;width:100%}
.md-mir{position:absolute;visibility:hidden;padding-top:0;padding-bottom:0}
.md-hl{position:absolute;inset:0 auto auto 0;pointer-events:none;color:var(--text)}
.md-ta{position:relative;display:block;border:0;outline:0;resize:none;background:transparent;color:transparent;caret-color:var(--text);overflow:hidden;min-height:100%}
.md-ta::selection{background:var(--accent-soft);color:transparent}
.t-h{color:var(--accent);font-weight:700}.t-q{color:var(--text-2);font-style:italic}.t-lm{color:var(--warning)}.t-m{color:#B5651D}.t-ic,.t-cd{color:#2E8B57}.t-f{color:var(--text-3)}.t-b{font-weight:700}.t-ct{color:#8E44AD;background:rgba(142,68,173,.1);border-radius:3px}.t-lk{color:var(--accent);text-decoration:underline}.t-tb{color:var(--text-2)}
html[data-theme="dark"] .t-m{color:#E5A15A}html[data-theme="dark"] .t-ic,html[data-theme="dark"] .t-cd{color:#7EC699}html[data-theme="dark"] .t-ct{color:#C792EA}
.md-pv{overflow:auto;height:100%;background:var(--bg-doc,var(--bg-panel))}
.md-doc{max-width:var(--doc-w,760px);margin:0 auto;padding:28px 36px 80px;font-size:var(--doc-fs,14.5px);line-height:1.75;color:var(--text)}
.md-doc h1{font-size:1.8em;margin:.2em 0 .6em;line-height:1.3}.md-doc h2{font-size:1.35em;margin:1.4em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--border)}.md-doc h3{font-size:1.1em;margin:1.2em 0 .4em}
.md-doc p{margin:.6em 0}.md-doc code{font-family:var(--font-mono);font-size:.9em;background:var(--bg-hover);padding:1px 5px;border-radius:4px}
.md-doc blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--text-2);border-radius:0 6px 6px 0}
.md-doc ul,.md-doc ol{padding-left:1.6em}.md-doc li.task{list-style:none;margin-left:-1.3em}.md-doc li.task input{margin-right:6px;vertical-align:-2px}
.md-doc hr{border:0;border-top:1px solid var(--border);margin:1.6em 0}
.mdtbl{border-collapse:collapse;margin:1em 0;font-size:.92em;width:100%}.mdtbl th,.mdtbl td{border:1px solid var(--border);padding:5px 10px;text-align:left}.mdtbl th{background:var(--bg-header)}
.mdcode{position:relative;background:var(--bg-window);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto;font:12.5px/1.6 var(--font-mono)}.mdcode .lang{position:absolute;right:8px;top:4px;font-size:10.5px;color:var(--text-3)}.mdcode code{background:none;padding:0}
.mdcode .k{color:#C678DD}.mdcode .s{color:#98C379}.mdcode .c{color:var(--text-3);font-style:italic}.mdcode .n{color:#D19A66}
html[data-theme="light"] .mdcode .k{color:#A626A4}html[data-theme="light"] .mdcode .s{color:#50A14F}html[data-theme="light"] .mdcode .n{color:#986801}
.math{font-family:"Cambria Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}.math i,.mathb i{font-style:italic}
.mathb{position:relative;text-align:center;margin:1em 0;font-family:"Cambria Math","Times New Roman",serif;font-size:1.2em}.mathb .eqn{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:.8em;color:var(--text-2)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em}.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.mdfig{margin:1.2em 0;text-align:center}.mdfig img{max-width:100%;border:1px solid var(--border);border-radius:6px;background:#fff}.mdfig figcaption{font-size:.85em;color:var(--text-2);margin-top:4px}
.cite{color:var(--accent);text-decoration:none;cursor:pointer}.cite.bad{color:var(--danger)}.cite sup{font-size:.72em}
.refh{margin-top:2em!important}.biblio{font-size:.88em;color:var(--text-2);padding-left:2em}.biblio li{margin:.3em 0}.bad{color:var(--danger)}
.reflist{overflow:auto}.refit{padding:7px 10px;border-bottom:1px solid var(--border);cursor:default}.refit:hover{background:var(--bg-hover)}.refit.sel{background:var(--accent-soft)}
.refit .rt{display:flex;gap:6px;align-items:flex-start}.refit .rt b{font-weight:600;font-size:12.5px;line-height:1.4}.refit .ra{color:var(--text-2);font-size:11.5px;margin:2px 0 0 20px}.refit .rk{display:flex;gap:4px;margin:4px 0 0 20px;align-items:center;flex-wrap:wrap}.refit .rk code{font-size:11px;color:var(--text-3)}
.refcard{padding:12px}.refcard h3{margin:0 0 10px;font-size:14px;line-height:1.4}.fmtref{font-size:12px;line-height:1.6;background:var(--bg-window);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
